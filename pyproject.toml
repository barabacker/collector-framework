[project]
name = "collector-framework"
version = "0.0.1"
description = "A tiny async scraping framework: Spider-style parsers over a curl_cffi HTTP layer with hooks, retries and throttling."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "barabacker" }]
keywords = ["scraping", "crawler", "spider", "async", "curl-cffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    "curl-cffi>=0.7",
    "parsel>=1.9",
]

[project.urls]
Homepage = "https://github.com/barabacker/collector-framework"
Issues = "https://github.com/barabacker/collector-framework/issues"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# The default run stays offline: a third party's uptime and rate limit are not
# this repository's business, so tests that need one are opt-in, with
# `uv run pytest -m network`.
#
# The cost of that is worth stating plainly: nothing in the default run reaches
# a socket. curl_cffi, the retry loop's sleeps, the Throttle lock and a session
# outliving a cancelled stream() are covered only under `-m network`, with the
# one exception of the regression test for the hook-driven retry, which those
# network tests found and which is checked against the fake in test_client.py.
addopts = ["-m", "not network"]
markers = [
    "network: needs the public internet (mockhttp.org); excluded unless asked for",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF009"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
known-first-party = ["collector"]
